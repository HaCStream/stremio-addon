name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Home Assistant add-on configuration
        run: python scripts/validate_addon_config.py
      - name: Validate AppArmor profile syntax
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y apparmor
          apparmor_parser --skip-kernel-load --skip-cache addon/apparmor.txt
      - name: Run tests
        run: python -m pytest -q

  build:
    needs: test
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
            machine: x86_64
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build release image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: stremio-addon:ci
      - name: Build Home Assistant source image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: addon/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: stremio-addon:ha-ci
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.24
            BUILD_ARCH=${{ matrix.arch }}
      - name: Check architecture and application imports in both images
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          for image in stremio-addon:ci stremio-addon:ha-ci; do
            docker run --rm --entrypoint python -e EXPECTED_MACHINE "$image" -c '
          import os, platform, sqlite3
          import addon.__main__, addon.healthcheck
          assert platform.machine() == os.environ["EXPECTED_MACHINE"], platform.machine()
          with sqlite3.connect(":memory:") as db:
              db.execute("CREATE VIRTUAL TABLE files USING fts5(title)")
          print("Application imports and SQLite FTS5 OK on", platform.machine())
          '
          done
