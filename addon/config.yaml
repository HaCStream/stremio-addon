name: Stremio Telegram
version: "1.4.3"
slug: stremio_telegram
description: A self-hosted addon that connects to your Telegram user account, discovers joined private broadcast channels, and indexes uploaded videos for browsing, searching, and streaming through your server

url: https://github.com/hilayc/stremio-addon
image: ghcr.io/hilayc/stremio-addon
webui: "http://[HOST]:[PORT:8001]/"
ingress: true
ingress_port: 8001
ingress_entry: /
arch:
  - amd64
startup: application
boot: auto
init: false
host_network: true
ports:
  8000/tcp: null
  8001/tcp: null
timeout: 30
options:
  PORT: 8000
  debug:
    DEBUG_ENABLED: true
    DEBUG_PORT: 8001
    DEBUG_HOST: "0.0.0.0"
  ADDON_URL: ""
  API_KEY: ""
  API_ID: 0
  API_HASH: ""
  USER_SESSION_STRING: ""
  CACHE_MB: 512
  CHANNEL_IDS: ""
  ai:
    AI_SEARCH_ENABLED: false
    GEMINI_API_KEY: ""
    AI_SEARCH_PREFIX_ENABLED: false
schema:
  PORT: port
  debug:
    DEBUG_ENABLED: bool
    DEBUG_PORT: port
    DEBUG_HOST: str
  ADDON_URL: url
  API_KEY: password
  API_ID: int(1,)
  API_HASH: password
  USER_SESSION_STRING: password
  CACHE_MB: int(0,)
  CHANNEL_IDS: str?
  ai:
    AI_SEARCH_ENABLED: bool
    GEMINI_API_KEY: password?
    AI_SEARCH_PREFIX_ENABLED: bool
