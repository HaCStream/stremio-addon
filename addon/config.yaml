name: Stremio Telegram
version: "1.6.10"
slug: stremio_telegram
description: A self-hosted addon that connects to your Telegram user account, builds catalogs from account chats and searches Telegram on demand for video playback

url: https://github.com/HaCStream/stremio-addon
image: ghcr.io/hacstream/stremio-addon
webui: "http://[HOST]:[PORT:8001]/"
ingress: true
ingress_port: 8001
ingress_entry: /
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
apparmor: true
ports:
  8000/tcp: 8000
  8001/tcp: 8001
timeout: 30
options:
  DEBUG_LEVEL: INFO
  ADDON_URL: ""
  ADDON_ACCESS_KEY: ""
  TELEGRAM_APP_API_ID: 0
  TELEGRAM_APP_API_HASH: ""
  USER_SESSION_STRING: ""
  CACHE_MB: 512
  CATALOG_INDEXING_ENABLED: true
  SCAN_INTERVAL_SECONDS: 300
  CHANNEL_IDS: ""
  DISPLAY_COLLECTION: false
  tmdb:
    TMDB_API_KEY: ""
  ai:
    AI_SEARCH_ENABLED: false
    GEMINI_API_KEY: ""
    REQUIRE_AI_SUFFIX_FOR_AI_SEARCH: true
  developer_ui:
    DEV_UI_ENABLED: false
    SKIP_DEV_UI_AUTH: false
    DEV_UI_PASSWORD: ""
schema:
  # Six choices make Home Assistant render a dropdown instead of radio buttons.
  DEBUG_LEVEL: list(NOTSET|DEBUG|INFO|WARNING|ERROR|CRITICAL)
  ADDON_URL: url
  ADDON_ACCESS_KEY: password
  TELEGRAM_APP_API_ID: int(1,)
  TELEGRAM_APP_API_HASH: password
  USER_SESSION_STRING: password
  CACHE_MB: int(0,)
  CATALOG_INDEXING_ENABLED: bool
  SCAN_INTERVAL_SECONDS: int(1,)
  CHANNEL_IDS: str?
  DISPLAY_COLLECTION: bool
  tmdb:
    TMDB_API_KEY: password?
  ai:
    AI_SEARCH_ENABLED: bool
    GEMINI_API_KEY: password?
    REQUIRE_AI_SUFFIX_FOR_AI_SEARCH: bool
  developer_ui:
    DEV_UI_ENABLED: bool
    SKIP_DEV_UI_AUTH: bool
    DEV_UI_PASSWORD: password?


