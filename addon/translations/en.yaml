configuration:
  ADDON_URL:
    name: Addon URL
    description: >-
      Public HTTP or HTTPS base URL used for addon links. Include the scheme and domain,
      without a trailing slash or API key.
  API_KEY:
    name: Addon API key
    description: >-
      Secret with at least 32 URL-safe characters used to protect addon and dashboard requests.
  API_ID:
    name: Telegram API ID
    description: Numeric application ID obtained from Telegram.
  API_HASH:
    name: Telegram API hash
    description: Secret application hash paired with the Telegram API ID.
  USER_SESSION_STRING:
    name: Telegram session string
    description: Complete Telethon StringSession for the Telegram account to index.
  CACHE_MB:
    name: Cache limit (MiB)
    description: Maximum disk space for cached video chunks in MiB; zero disables the cache.
  CHANNEL_IDS:
    name: Channel IDs
    description: >-
      Optional comma-separated negative Telegram channel IDs. Leave blank to scan all
      joined private broadcast channels.
  ai:
    name: AI search
    description: Configure optional Gemini-powered online title search.
    fields:
      AI_SEARCH_ENABLED:
        name: Enable AI search
        description: Search online and show separate Telegram AI Movies and Telegram AI Series catalogs.
      GEMINI_API_KEY:
        name: Gemini API key
        description: Gemini key used for online discovery of titles matching your search description.
      AI_SEARCH_PREFIX_ENABLED:
        name: Require AI search prefix
        description: >-
          Only send search queries to Gemini when they begin with a separate AI word,
          case insensitive. Applies to both the catalogs and debug AI search.
      REQUIRE_DOT_SUFFIX_FOR_AI_SEARCH:
        name: Require dot suffix for AI search
        description: >-
          Wait until your AI search description ends with a dot (.) before calling
          Gemini, preventing unfinished searches from using your API quota while
          typing. Enabled by default. The final dot is removed before sending the
          description. Applies to both the catalogs and debug AI search. Disable
          to allow AI searches without a final dot.
  debug:
    name: Debug dashboard
    description: Configure the dashboard for inspecting indexing and search activity.
    fields:
      DEBUG_ENABLED:
        name: Enable debug dashboard
        description: Allow access to the dashboard and its search and sync tools.
      DEBUG_HOST:
        name: Debug listen address
        description: Address the dashboard binds to. Use 0.0.0.0 for access through the network.
      SKIP_DEBUG_AUTH:
        name: Skip debug authentication
        description: >-
          Open the debug dashboard without entering the API key. Anyone who can reach
          the dashboard can view its data, search the index, and request a sync.
network:
  8000/tcp: Stremio addon endpoint.
  8001/tcp: Debug dashboard endpoint.
