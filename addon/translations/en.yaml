configuration:
  ADDON_URL:
    name: Addon URL
    description: >-
      Public HTTP or HTTPS base URL used for addon links. Include the scheme and domain,
      without a trailing slash or API key.
  ADDON_ACCESS_KEY:
    name: Addon access key
    description: >-
      Secret with at least 32 URL-safe characters used to protect addon and dashboard requests.
  TELEGRAM_APP_API_ID:
    name: Telegram app API ID
    description: Numeric application ID obtained from Telegram.
  TELEGRAM_APP_API_HASH:
    name: Telegram app API hash
    description: Secret application hash paired with the Telegram API ID.
  USER_SESSION_STRING:
    name: Telegram session string
    description: Complete Telethon StringSession for the Telegram account to index.
  CACHE_MB:
    name: Cache limit (MiB)
    description: Maximum disk space for cached video chunks in MiB; zero disables the cache.
  CHANNEL_IDS:
    name: Channel and group IDs
    description: >-
      Optional comma-separated negative Telegram channel or group IDs. Leave blank to scan all
      joined public and private channels and groups.
  DISPLAY_COLLECTION:
    name: Display collection
    description: >-
      Show Telegram Videos and Telegram Series collections on the main screen in
      Stremio/Nuvio. Disabled by default; search remains available. Restart the
      add-on and refresh or reinstall it in your client after changing this option.
  tmdb:
    name: TMDB show matching
    description: Match Telegram shows to public catalog episode identities.
    fields:
      TMDB_API_KEY:
        name: TMDB API key
        description: >-
          Optional TMDB v3 API key. Enables background show matching and Telegram
          sources under public catalog episodes. Review ambiguous matches in the
          Developer UI. Leave blank to disable new lookups.
  ai:
    name: AI search
    description: Configure optional Gemini-powered online title search.
    fields:
      AI_SEARCH_ENABLED:
        name: Enable AI search
        description: Search online and show separate Telegram AI Movies and Telegram AI Series catalogs.
      GEMINI_API_KEY:
        name: Gemini API key
        description: Gemini key used for online discovery of titles matching your search description.
      REQUIRE_AI_SUFFIX_FOR_AI_SEARCH:
        name: Require AI suffix for AI search
        description: >-
          Only call Gemini when your search description ends with a separate AI
          word (case insensitive: AI, Ai, ai, or aI). Append it when you finish
          typing to prevent unfinished searches from using your API quota.
          Enabled by default. The AI suffix is removed before sending the
          description. Applies to both the catalogs and Developer UI AI search. Disable
          to allow AI searches without the suffix.
  developer_ui:
    name: Developer UI
    description: Configure the dashboard for inspecting indexing and search activity.
    fields:
      DEV_UI_ENABLED:
        name: Enable Developer UI
        description: Allow access to the dashboard and its search and sync tools.
      SKIP_DEV_UI_AUTH:
        name: Skip Developer UI authentication
        description: >-
          Open the Developer UI without entering the addon access key. Anyone who can reach
          the dashboard can view its data, search the index, and request a sync.
network:
  8000/tcp: Stremio addon endpoint.
  8001/tcp: Developer UI endpoint.
