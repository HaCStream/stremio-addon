services:
  addon:
    build: .
    env_file: .env
    environment:
      DEBUG_LEVEL: ${DEBUG_LEVEL:-INFO}
      DEV_UI_HOST: ${DEV_UI_HOST:-0.0.0.0}
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
    volumes:
      - telegram-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  telegram-data:
